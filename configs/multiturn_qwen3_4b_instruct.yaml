# Stable multiturn GRPO recipe for Qwen3-4B-Instruct.
# Run identity (resume_adapter, output_dir, start_seed) belongs on the CLI
# or in an untracked dated copy — do not commit a specific checkpoint path.
model:
  name: unsloth/Qwen3-4B-Instruct-2507-bnb-4bit
  max_seq_length: 2048
  lora_rank: 16
train:
  steps: 50
  tasks_per_step: 2
  generations: 6
  max_turns: 15
  patience: 5
  patience_eps: 0.2
  history_window: 8
  max_new_tokens: 256
  temperature: 1.0
  lr: 5.0e-6
  max_grad_norm: 0.1
  save_every: 5
  beta: 0.01
  kl_ref: start
data:
  start_seed: 5000
  goal_config: configs/goal_distribution.yaml
  param_spread: 0.35
  min_start_headroom_db: 40.0
reward: {}
runtime:
  output_dir: outputs/multiturn-qwen3-4b-instruct
  resume_adapter: ""
  allow_raw_base: false
