[project]
name = "qucs-llm-optimizer"
version = "0.1.0"
description = "Intent-driven Qucs optimization with multi-turn GRPO and SFT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
train = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "peft",
    "PyYAML",
    "transformers",
    "trl",
]

[project.scripts]
qucs-corpus = "training.corpus_cli:main"
qucs-multiturn = "training.multiturn_train:main"
qucs-sft = "training.sft:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["training*"]
