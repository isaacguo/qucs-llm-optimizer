[project]
name = "qucs-llm-optimizer"
version = "0.1.0"
description = "Intent-driven Qucs optimization with multi-turn GRPO and SFT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
train = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "peft",
    "PyYAML",
    "transformers",
    "trl",
]

[project.scripts]
qucs-corpus = "corpus.cli:main"
qucs-multiturn = "training.grpo.train:main"
qucs-sft = "training.sft.train:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["training*", "corpus*"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
]
